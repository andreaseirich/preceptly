[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "migrations",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports F401, unused vars F841, etc.)
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "S110", # flake8-bandit: try-except-pass (empty exception handler)
    "S112", # flake8-bandit: try-except-continue
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py are ok

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", "venv", ".venv"]

