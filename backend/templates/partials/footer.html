{% load i18n %}
<style>
.site-footer {
    margin-top: 40px;
    background: #1f2933;
    color: #f5f7fa;
    padding: 25px 20px;
}
.site-footer a {
    color: #d9e2ec;
    text-decoration: none;
    margin-right: 15px;
}
.site-footer a:hover {
    text-decoration: underline;
}
.site-footer .footer-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 15px;
    text-align: center;
}
.site-footer .footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
}
.site-footer .footer-meta {
    font-size: 0.85em;
    color: #bcccdc;
}
.site-footer nav {
    position: static;
    z-index: auto;
    background: none;
    box-shadow: none;
    padding: 0;
    margin: 0;
    border-radius: 0;
}
.site-footer #eRecht24RevocationButton {
    background: transparent;
    color: #d9e2ec;
    border: 1px solid #d9e2ec;
    padding: 3px 10px;
    font-size: 0.95em;
    font-weight: normal;
    min-height: 0;
    min-width: 0;
    line-height: 1.4;
    border-radius: 4px;
    text-decoration: none;
    margin-right: 0;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.site-footer #eRecht24RevocationButton:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
    border-color: #ffffff;
    text-decoration: none;
}
@media (max-width: 768px) {
    .site-footer .footer-container {
        flex-direction: column;
        align-items: center;
    }
    .site-footer a {
        margin-right: 10px;
    }
}
</style>
<footer class="site-footer" aria-label="Seitenende">
    <div class="footer-container">
        <nav aria-label="Footer-Navigation">
            <div class="footer-links">
                <a href="{% url 'core:legal_imprint' %}">{% trans "Imprint" %}</a>
                <a href="{% url 'core:legal_privacy' %}">{% trans "Privacy Policy" %}</a>
                <a href="{% url 'core:legal_terms' %}">{% trans "Terms of Service" %}</a>
                <a href="{% url 'core:legal_withdrawal' %}">{% trans "Withdrawal" %}</a>
                <a href="{% url 'core:legal_avv' %}">{% trans "Data Processing Agreement" %}</a>
                <a href="{% url 'core:legal_about' %}">
                    {% if LANGUAGE_CODE == "de" %}Über uns{% else %}About us{% endif %}
                </a>
                <!-- Widerrufsbutton fuer den Shop "Preceptly" - Anfang -->
                <a id="eRecht24RevocationButton" href="https://widerrufsbutton-cdn.e-recht24.de/019f5526-4b9d-7212-9233-20b6dabdf91d" data-shop-id="019f5526-4b9d-7212-9233-20b6dabdf91d" data-key="4A7hLTFn8T3hQgVkcE0fBAA8gJZPagrOSCn4n6CXq4FTw0CsxeJiaY925LGHiKAJ" aria-label="Vertrag widerrufen" aria-disabled="true" title="Widerrufsformular konnte nicht geladen werden" style="opacity:.5" class="btn btn-primary" target="_blank"><span>Vertrag widerrufen</span></a>
                <!-- Widerrufsbutton fuer den Shop "Preceptly" - Ende -->
            </div>
        </nav>
        <script async src="https://widerrufsbutton-cdn.e-recht24.de/widgets/revocation-button.js"></script>
        <div class="footer-meta">
            <span>© {% now "Y" %} andicode</span>
            <span>· Preceptly by <a href="https://andicode.de" target="_blank" rel="noopener noreferrer" style="color: inherit;">andicode</a></span>
        </div>
    </div>
</footer>
