{% load i18n static %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <link rel="icon" href="{% static 'icons/favicon.ico' %}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{% static 'brand/preceptly-icon.svg' %}">
    <link rel="preload" href="{% static 'fonts/source-sans-3-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'core/css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/components.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
    <title>{% trans "Page not found" %} – Preceptly</title>
</head>
<body class="auth-page">
<main id="main-content">
    <div class="auth-card">
        <p class="auth-brand">
            <img class="logo logo--on-light" src="{% static 'brand/preceptly-logo.svg' %}" alt="Preceptly" width="116" height="30">
            <img class="logo logo--on-dark" src="{% static 'brand/preceptly-logo-dark.svg' %}" alt="" width="116" height="30">
        </p>
        <p class="auth-code" aria-hidden="true">404</p>
        <h1 class="auth-title">{% trans "The page you are looking for does not exist." %}</h1>
        <a href="/" class="btn btn-block">{% trans "Back to Home" %}</a>
    </div>
</main>
</body>
</html>
