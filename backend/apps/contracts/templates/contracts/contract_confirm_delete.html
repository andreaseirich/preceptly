{% extends 'core/base.html' %}
{% load i18n %}

{% block title %}Vertrag löschen – Preceptly{% endblock %}

{% block content %}
<h1>Schüler löschen</h1>

<p>Schüler <strong>{{ contract }}</strong> wirklich löschen?</p>
<p>{% trans "This action cannot be undone." %}</p>

<form method="post">
    {% csrf_token %}
    <div class="btn-group">
        <button type="submit" class="btn btn-danger" aria-label="Vertrag löschen">{% trans "Delete" %}</button>
        <a href="{% url 'contracts:detail' contract.pk %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
    </div>
</form>
{% endblock %}
