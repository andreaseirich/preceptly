<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entwickler-Statistiken – Anmeldung</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 48px 40px;
    width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo h1 { font-size: 1.4rem; color: #1a1a2e; font-weight: 700; }
  .logo p { color: #6b7280; font-size: 0.875rem; margin-top: 4px; }
  label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; padding: 10px 14px; border: 1px solid #d1d5db;
    border-radius: 6px; font-size: 1rem; outline: none; transition: border-color 0.15s;
  }
  input[type="password"]:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  .error-msg {
    background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626;
    border-radius: 6px; padding: 10px 14px; font-size: 0.875rem; margin-top: 12px;
  }
  .btn {
    display: block; width: 100%; padding: 11px; margin-top: 20px;
    background: #6366f1; color: #fff; border: none; border-radius: 6px;
    font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: #4f46e5; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>Entwickler-Statistiken</h1>
    <p>Nur für autorisierte Personen</p>
  </div>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="login">
    <label for="password">Passwort</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password" required>
    {% if error %}
    <div class="error-msg" role="alert">Falsches Passwort.</div>
    {% endif %}
    <button type="submit" class="btn">Anmelden</button>
  </form>
</div>
</body>
</html>
