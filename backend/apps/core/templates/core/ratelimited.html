{% load static %}<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zu viele Anfragen - Preceptly</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #2c3e50;
            color: #f0f0f0;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            background: #34495e;
            border-radius: 10px;
            padding: 28px 24px;
            max-width: 460px;
            width: 100%;
        }
        h1 {
            font-size: 1.3em;
            margin-top: 0;
        }
        a.btn {
            display: inline-block;
            margin-top: 16px;
            background: #2ecc71;
            color: #16211f;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
    <script src="{% static 'js/actions.js' %}" nonce="{{ csp_nonce }}" defer></script>
</head>
<body>
    <main class="box">
        <h1>⏳ Zu viele Anfragen</h1>
        <p>Von deinem Gerät kamen in kurzer Zeit sehr viele Anfragen. Zum Schutz vor Missbrauch ist diese Aktion deshalb kurz gesperrt.</p>
        <p>Bitte warte etwa eine Minute und versuche es dann erneut.</p>
        <a class="btn" href="/" data-history-back>Zurück</a>
    </main>
</body>
</html>
