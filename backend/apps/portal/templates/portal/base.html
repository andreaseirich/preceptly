<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Preceptly Portal{% endblock %}</title>
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-nav: #2c3e50;
            --text-primary: #212121;
            --text-secondary: #666666;
            --text-nav: #ecf0f1;
            --border-color: #dddddd;
            --shadow: rgba(0,0,0,0.1);
            --input-border: #cccccc;
            --input-focus: rgba(0,123,255,0.25);
            --hover-bg: rgba(255,255,255,0.1);
            --active-bg: rgba(255,255,255,0.2);
            --table-header-bg: #f0f0f0;
            --table-hover-bg: rgba(0,0,0,0.03);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #1a1a1a;
                --bg-secondary: #242424;
                --bg-nav: #1e2a35;
                --text-primary: #e8e8e8;
                --text-secondary: #aaaaaa;
                --text-nav: #ecf0f1;
                --border-color: #3a3a3a;
                --shadow: rgba(0,0,0,0.4);
                --input-border: #444444;
                --input-focus: rgba(0,123,255,0.35);
                --hover-bg: rgba(255,255,255,0.08);
                --active-bg: rgba(255,255,255,0.15);
                --table-header-bg: #2e2e2e;
                --table-hover-bg: rgba(255,255,255,0.04);
            }
        }
        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --bg-nav: #1e2a35;
            --text-primary: #e8e8e8;
            --text-secondary: #aaaaaa;
            --text-nav: #ecf0f1;
            --border-color: #3a3a3a;
            --shadow: rgba(0,0,0,0.4);
            --input-border: #444444;
            --input-focus: rgba(0,123,255,0.35);
            --hover-bg: rgba(255,255,255,0.08);
            --active-bg: rgba(255,255,255,0.15);
            --table-header-bg: #2e2e2e;
            --table-hover-bg: rgba(255,255,255,0.04);
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        header {
            background: var(--bg-nav);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 4px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-brand {
            color: var(--text-nav);
            font-weight: 700;
            font-size: 1.1em;
            text-decoration: none;
            letter-spacing: 0.02em;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-username {
            color: var(--text-nav);
            font-size: 0.9em;
            opacity: 0.85;
        }
        .logout-form { display: inline; }
        .btn-logout {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.35);
            color: var(--text-nav);
            padding: 4px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.82em;
            transition: background 0.15s;
        }
        .btn-logout:hover { background: rgba(255,255,255,0.15); }
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        h1 { color: var(--text-primary); margin-top: 0; }
        h2 { color: var(--text-secondary); margin-top: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        h3 { color: var(--text-secondary); }
        p { color: var(--text-primary); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 1px 3px var(--shadow); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); color: var(--text-primary); }
        th { background: var(--table-header-bg); font-weight: 600; }
        tr:hover { background: var(--table-hover-bg); }
        a { color: #007bff; }
        a:hover { text-decoration: underline; }
        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
        input, textarea, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.95em;
            margin-bottom: 12px;
        }
        input:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px var(--input-focus); border-color: #007bff; }
        label { display: block; font-size: 0.88em; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
        .btn-sm { display: inline-block; padding: 3px 9px; border-radius: 3px; border: 1px solid; font-size: 0.82em; cursor: pointer; text-decoration: none !important; background: transparent; transition: background 0.15s, color 0.15s; white-space: nowrap; line-height: 1.5; }
        .btn-sm:active { transform: scale(0.97); }
        .btn-sm-primary   { color: #007bff; border-color: #007bff; }
        .btn-sm-primary:hover   { background: #007bff; color: #fff; }
        .btn-sm-secondary { color: var(--text-secondary); border-color: var(--border-color); }
        .btn-sm-secondary:hover { background: var(--bg-nav); color: #fff; }
        .btn-sm-danger    { color: #dc3545; border-color: #dc3545; }
        .btn-sm-danger:hover    { background: #dc3545; color: #fff; }
        .alert-info { padding: 15px; background: rgba(33,150,243,0.12); border: 1px solid rgba(33,150,243,0.3); border-radius: 8px; margin-bottom: 20px; color: var(--text-primary); }
        .alert-warning { padding: 15px; background: rgba(255,193,7,0.12); border: 1px solid rgba(255,193,7,0.4); border-radius: 8px; margin-bottom: 20px; color: var(--text-primary); }
        .box-section { padding: 15px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 5px; margin-bottom: 20px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<header>
    <a class="header-brand" href="#">Preceptly Portal</a>
    <div class="header-right">
        {% if portal_user %}
        <span class="header-username">{{ portal_user.user.username }}</span>
        <form class="logout-form" method="post" action="{% url 'portal:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn-logout">Abmelden</button>
        </form>
        {% endif %}
    </div>
</header>
<main>
    {% block content %}{% endblock %}
</main>
{% block extra_js %}{% endblock %}
</body>
</html>
