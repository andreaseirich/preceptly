<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Reset your Preceptly password</title></head>
<body style="font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
  <h1 style="color: #007bff;">Preceptly</h1>
  <h2>Reset your portal password</h2>
  <p>You requested a password reset for your Preceptly portal account ({{ student.full_name }}).</p>
  <div style="text-align: center; margin: 30px 0;">
    <a href="{{ reset_url }}"
       style="background: #007bff; color: white; padding: 14px 28px; text-decoration: none; border-radius: 6px; font-size: 16px; display: inline-block;">
      Set New Password
    </a>
  </div>
  <p style="color: #666; font-size: 14px;">Or copy: <a href="{{ reset_url }}">{{ reset_url }}</a></p>
  <p style="color: #999; font-size: 12px;">If you didn't request this, ignore this email.</p>
  <hr style="border: none; border-top: 1px solid #eee;">
  <p style="color: #999; font-size: 12px; text-align: center;">Preceptly — <a href="{{ site_url }}">{{ site_url }}</a></p>
</body>
</html>
