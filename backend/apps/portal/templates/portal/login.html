<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    {% load i18n %}
    <title>{% trans "Login" %} – Preceptly Portal</title>
    <style>
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --text-primary: #212121;
            --text-secondary: #666666;
            --border-color: #dddddd;
            --shadow: rgba(0,0,0,0.1);
            --input-border: #cccccc;
            --input-focus: rgba(0,123,255,0.25);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #1a1a1a;
                --bg-secondary: #242424;
                --text-primary: #e8e8e8;
                --text-secondary: #aaaaaa;
                --border-color: #3a3a3a;
                --shadow: rgba(0,0,0,0.4);
                --input-border: #444444;
                --input-focus: rgba(0,123,255,0.35);
            }
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 16px var(--shadow);
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }
        .login-brand {
            text-align: center;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 0.88em;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95em;
            margin-bottom: 16px;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--input-focus);
            border-color: #007bff;
        }
        .btn-login {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }
        .btn-login:hover { background: #0069d9; }
        .alert-warning {
            padding: 12px 15px;
            background: rgba(255,193,7,0.12);
            border: 1px solid rgba(255,193,7,0.4);
            border-radius: 8px;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-brand">Preceptly Portal</div>
    <div class="login-subtitle">{% trans "Your learning hub" %}</div>

    {% if error %}
    <div class="alert-warning">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="id_username">{% trans "Username" %}</label>
        <input type="text" id="id_username" name="username" autocomplete="username" autofocus required>

        <label for="id_password">{% trans "Password" %}</label>
        <input type="password" id="id_password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn-login">{% trans "Login" %}</button>
    </form>
</div>
</body>
</html>
