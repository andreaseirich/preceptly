<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    {% load i18n %}
    <title>Passwort zurücksetzen – Preceptly</title>
    <style>
        :root {
            --bg-primary: #f5f7f9;
            --bg-secondary: #ffffff;
            --text-primary: #22303f;
            --text-secondary: #5a6b7b;
            --border-color: #d7dee5;
            --shadow: rgba(0,0,0,0.1);
            --input-border: #d7dee5;
            --accent: #0d8069;
            --accent-hover: #0b6f5c;
            --input-focus: rgba(13,128,105,0.35);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #1a1a1a;
                --bg-secondary: #242424;
                --text-primary: #e8e8e8;
                --text-secondary: #aaaaaa;
                --border-color: #3a3a3a;
                --shadow: rgba(0,0,0,0.4);
                --input-border: #444444;
                --accent: #4dd0b3;
                --accent-hover: #6ee0c5;
                --input-focus: rgba(77,208,179,0.45);
            }
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 16px var(--shadow);
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }
        .login-brand {
            text-align: center;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 0.88em;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95em;
            margin-bottom: 16px;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--input-focus);
            border-color: var(--accent);
        }
        .btn-login {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }
        .btn-login:hover { background: var(--accent-hover); }
        .alert-info {
            padding: 12px 15px;
            background: rgba(13,128,105,0.08);
            border: 1px solid rgba(13,128,105,0.3);
            border-radius: 8px;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<main id="main-content">
<div class="login-card">
    <div class="login-brand">Preceptly Portal</div>
    <div class="login-subtitle">Passwort zurücksetzen</div>

    {% if sent %}
    <div class="alert-info" role="alert">
        Falls dein Konto existiert, wurde ein Link zum Zurücksetzen gesendet.
    </div>
    {% else %}
    <form method="post">
        {% csrf_token %}
        <label for="id_email">E-Mail-Adresse</label>
        <input type="email" id="id_email" name="email" autocomplete="email" autofocus required aria-required="true">

        <button type="submit" class="btn-login">Link zum Zurücksetzen senden</button>
    </form>
    {% endif %}
</div>
<p style="margin-top: 1.5em; font-size: 0.9em; text-align: center;">
    <a href="/portal/login/" style="color: var(--text-secondary, #666);">Zurück zur Anmeldung</a>
</p>
</main>
</body>
</html>
