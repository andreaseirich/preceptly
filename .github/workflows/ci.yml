name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'docs/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MOCK_LLM: 1
      DJANGO_SECRET_KEY: test-ci-secret
      SECRET_KEY: test-ci-secret
      DJANGO_DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SETTINGS_MODULE: tutorflow.settings
    steps:
      - uses: actions/checkout@v7

      - name: Repo hygiene check
        run: bash scripts/repo_hygiene_check.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install "pip>=26.1.2"
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Dependency audit
        run: pip-audit
        # No ignores. If a new advisory has no fix yet, add a justified `--ignore-vuln <ID>` here and document it in
        # SECURITY.md (backend/apps/core/tests/test_dependency_assumptions.py fails for an undocumented ignore).
        # History: Pygments is pinned to a release (2.20.0+ fixes CVE-2026-4539), Twisted 26.10.0 fixes the advisories
        # that were ignored until 17.11.2026 (listed in SECURITY.md), pip>=26.1.2 is installed above (CVE-2026-3219).

      - name: Django deploy check
        working-directory: ./backend
        env:
          DEBUG: "False"
          SECRET_KEY: test-ci-secret-key-for-deploy-check-must-be-fifty-chars
          ALLOWED_HOSTS: test.example.com
          TURN_CREDENTIAL: dummy-turn-credential-for-ci-deploy-check
        run: |
          python manage.py check --deploy --fail-level WARNING

      - name: Ruff format
        run: |
          # Format code
          ruff format backend/apps backend/tutorflow
          # Fail only if tracked files were modified (ignore untracked __pycache__/logs from CI)
          if ! git diff --quiet; then
            echo "::error::Code formatting issues found. Files were auto-formatted."
            echo "Please run './scripts/format.sh' or 'ruff format backend/apps backend/tutorflow' locally and commit the changes."
            echo ""
            echo "Files that need formatting:"
            git diff --name-only
            echo ""
            echo "Diff:"
            git diff
            exit 1
          else
            echo "✅ All files are properly formatted."
          fi

      - name: Ruff lint
        run: ruff check backend/apps backend/tutorflow

      - name: Compile Python sources
        run: python -m compileall .

      - name: Run Django tests
        working-directory: ./backend
        run: python manage.py test

